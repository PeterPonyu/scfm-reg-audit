# Deploy Hugo site/ to GitHub Pages.
# Publish dir only — never repo root, never docs/.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.165.0"

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Hugo extended
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C /tmp -xzf /tmp/hugo.tar.gz hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          hugo version
      - name: Assemble and test
        run: bash site/test.sh
      - name: Log artifact
        run: |
          echo "assemble output: site/public"
          find site/public -type f | wc -l
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public
          include-hidden-files: true

  deploy:
    needs: assemble
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
